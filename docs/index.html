<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MusicByKico</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2.2rem;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #888;
      font-size: 1rem;
      margin-bottom: 2.5rem;
    }
    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    a.btn {
      display: inline-block;
      padding: 0.7rem 1.6rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    a.btn:hover { opacity: 0.85; }
    a.btn-primary {
      background: #c084fc;
      color: #0f0f0f;
    }
    a.btn-secondary {
      background: #1e1e1e;
      color: #e0e0e0;
      border: 1px solid #3a3a3a;
    }
    footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎵</div>
    <h1>MusicByKico</h1>
    <p class="subtitle">A Discord music bot powered by Lavalink &amp; YouTube Music.</p>
    <div class="links">
      <a class="btn btn-primary" href="privacy.html">Privacy Policy</a>
      <a class="btn btn-secondary" href="terms.html">Terms of Service</a>
    </div>
    <footer>&copy; 2026 Kico</footer>
  </div>
</body>
</html>
