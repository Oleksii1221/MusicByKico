services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: musicbot-lavalink
    restart: unless-stopped
    volumes:
      - ./docker/lavalink/application.yml:/opt/Lavalink/application.yml
    ports:
      - "2333:2333"

  bot:
    build:
      context: ..
      dockerfile: deploy/docker/bot.Dockerfile
    container_name: musicbot-bot
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - lavalink