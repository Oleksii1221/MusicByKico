[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musicbot"
version = "0.2.0"
description = "Professional Discord music bot built with discord.py, Mafic and Lavalink"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Kico" }
]
dependencies = [
  "discord.py>=2.7.0,<3.0.0",
  "mafic>=2.10.1,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "aiohttp>=3.11.0,<4.0.0",
  "PyNaCl>=1.5.0,<2.0.0",
  "davey>=0.1.4,<0.2.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.11.0",
  "mypy>=1.15.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true